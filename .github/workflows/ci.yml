name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码规范检查
        run: pnpm lint

      - name: TypeScript 类型检查
        run: pnpm typecheck

      - name: 代码格式检查
        run: pnpm format:check

      - name: 运行单元测试
        run: pnpm test

      - name: 构建扩展产物
        run: pnpm build

  gitleaks:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
